name: forklift-pasha tests

on:
  push:
    paths:
      - "ventures/forklift-pasha/**"
      - ".github/workflows/forklift-pasha-tests.yml"
  pull_request:
    paths:
      - "ventures/forklift-pasha/**"
      - ".github/workflows/forklift-pasha-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest suite (prototype)
        working-directory: ventures/forklift-pasha/prototype
        run: |
          python3 run_all_tests.py
      - name: Run schema validation (output.schema.json)
        working-directory: ventures/forklift-pasha/schema
        run: |
          python3 validate_test_cases.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright (npm package + chromium browser)
        working-directory: ventures/forklift-pasha
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser mockup regression checks (web-form-mockup/*.html)
        working-directory: ventures/forklift-pasha
        run: |
          node prototype/browser_mockup_checks.js
