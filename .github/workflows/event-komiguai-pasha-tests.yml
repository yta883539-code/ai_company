name: event-komiguai-pasha tests

on:
  push:
    paths:
      - "ventures/event-komiguai-pasha/**"
      - ".github/workflows/event-komiguai-pasha-tests.yml"
  pull_request:
    paths:
      - "ventures/event-komiguai-pasha/**"
      - ".github/workflows/event-komiguai-pasha-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest suite (prototype)
        working-directory: ventures/event-komiguai-pasha/prototype
        run: |
          python3 -m unittest discover -p "test_*.py" -v
      - name: Run schema validation (output.schema.json)
        working-directory: ventures/event-komiguai-pasha/schema
        run: |
          python3 validate_test_cases.py
