name: oshien-pasha tests

on:
  push:
    paths:
      - "ventures/oshien-pasha/**"
      - ".github/workflows/oshien-pasha-tests.yml"
  pull_request:
    paths:
      - "ventures/oshien-pasha/**"
      - ".github/workflows/oshien-pasha-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest suite (prototype)
        working-directory: ventures/oshien-pasha
        run: |
          python3 -m unittest discover -s prototype -p "test_*.py" -v
      - name: Run schema validation (output.schema.json)
        working-directory: ventures/oshien-pasha
        run: |
          python3 validate_test_cases.py
      - name: Check venue-master-draft.md / venue-master.json parity
        working-directory: ventures/oshien-pasha
        run: |
          python3 schema/check_venue_master_parity.py
