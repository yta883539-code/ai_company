<style>
  :root {
    --color-bg: #f5f7f6;
    --color-fg: #22282a;
    --color-accent: #e08a1e;
    --color-accent-dark: #a8620f;
    --color-card: #ffffff;
    --color-border: #dbe3e0;
    --color-muted: #5a6563;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    background: var(--color-bg);

  .draft-banner {

    font-size: 12px;
    padding: 6px 10px;

  .screen {

  header.app-bar {

  header.app-bar .logo {

    font-size: 18px;
    color: var(--color-accent-dark);
  }
  header.app-bar .lead {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--color-muted);
  }
  .kubun-link {
    display: block;
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    text-decoration: none;
    color: var(--color-fg);
  }
  .kubun-link .title {
    font-size: 16px;
    font-weight: bold;
  }
  .kubun-link .freq {
    display: inline-block;
    margin-left: 8px;
    font-size: 11px;
    color: #fff;
    background: var(--color-accent);
    padding: 2px 8px;
    border-radius: 999px;
    vertical-align: middle;
  }
  .kubun-link .desc {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--color-muted);
  }
  .kubun-link .arrow {
    float: right;
    color: var(--color-accent-dark);
    font-weight: bold;
  }
  footer.note {
    margin-top: 16px;
    font-size: 11px;
    color: var(--color-muted);
    text-align: center;
  }
